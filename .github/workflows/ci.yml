name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Rust typecheck (without licensed Wolfram runtime)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify Cargo metadata
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: Compile-check including unit tests
        env:
          DOCS_RS: "1"
        run: cargo check --all-targets
      - name: Validate lockfile generated by the resolved build
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Rust lint without native Wolfram linking
        env:
          DOCS_RS: "1"
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Validate independent Rust library consumer without Wolfram runtime
        env:
          DOCS_RS: "1"
        run: cargo check --manifest-path tests/consumer/Cargo.toml

      - name: Commit updated Cargo.lock after a successful source check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build: synchronize Cargo.lock for HTTP transport"
            git push origin HEAD:main
          fi
      - name: Test MCP smoke client independently
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Parse-check bounded Linux graphics probe
        run: python3 -m py_compile scripts/graphics_probe.py scripts/install_image_metadata_tools.py scripts/http_smoke.py
      - name: Syntax-check Linux Fish QA runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          fish -n scripts/linux_qa.fish

# Native WSTP linking and real Wolfram kernel tests are deliberately not claimed
# by this job. Run scripts/mcp_smoke.py on a properly configured local machine.
